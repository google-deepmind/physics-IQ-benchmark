name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-uv:
    name: Tests (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest physiq/tests/ -v
      - run: uv run physiq/generate_descriptions.py pvideo
      - run: uv sync --extra submission
      - run: uv run physiq/generate_example_submission.py
      - run: >
          uv run physiq/submit.py --run test__ci-smoke__2026-01-01
          --card submission/example/submission.yaml
          --descriptions submission/example/descriptions.csv
          --runs submission/example/run_01
          --validate-only

  test-pip:
    name: Tests (pip editable, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest physiq/tests/ -v
      - run: python physiq/generate_descriptions.py pvideo
      - run: pip install -e ".[submission]"
      - run: python physiq/generate_example_submission.py
      - run: >
          python physiq/submit.py --run test__ci-smoke__2026-01-01
          --card submission/example/submission.yaml
          --descriptions submission/example/descriptions.csv
          --runs submission/example/run_01
          --validate-only

  test-pip-noneditable:
    name: Tests (pip non-editable, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest physiq/tests/ -v
      - run: python physiq/generate_descriptions.py pvideo
      - run: pip install ".[submission]"
      - run: python physiq/generate_example_submission.py
      - run: >
          python physiq/submit.py --run test__ci-smoke__2026-01-01
          --card submission/example/submission.yaml
          --descriptions submission/example/descriptions.csv
          --runs submission/example/run_01
          --validate-only
