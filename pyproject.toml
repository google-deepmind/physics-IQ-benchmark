[project]
name = "physics-iq-benchmark"
version = "0.1.0"
description = "Physics IQ Benchmark evaluation suite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse",
    "matplotlib",
    "moviepy",
    "numpy",
    "opencv-python",
    "pandas",
    "Pillow",
    "tqdm",
    # data visualization
    "seaborn",
    "plotly",
    "kaleido",
    "scipy",
    "scikit-learn",
    "ipywidgets",
    "jupyter",
    "black>=26.3.1",
    "pytest>=9.0.3",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["physiq/tests"]
pythonpath = ["physiq"]
addopts = "--import-mode=importlib"
