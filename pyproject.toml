[project]
name = "physics-iq-benchmark"
version = "1.1.0"
description = "Physics IQ Verified Benchmark evaluation suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "moviepy",
    "joblib>=1.0",
    "numpy>=1.21",
    "opencv-python",
    "pandas>=2.0",
    "Pillow",
    "tqdm",
    # data visualization
    "seaborn",
    "plotly",
    "kaleido",
    "scipy",
    "scikit-learn",
    "pydantic>=2.13.4",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "black",
    "jupyter",
    "ipywidgets",
]

[project.urls]
"Homepage Physics-IQ" = "https://physics-iq.github.io/"
# TODO: Change this to new website
"Homepage Physics-IQ Verified" = "https://physics-iq.github.io/"
"Physics-IQ Paper" = "https://arxiv.org/abs/2501.09038"
# TODO: Change this to new paper
"Physics-IQ Verified Paper" = "https://arxiv.org/abs/2501.09038"
Repository = "https://github.com/google-deepmind/physics-IQ-benchmark"
"Bug Tracker" = "https://github.com/google-deepmind/physics-IQ-benchmark/issues"

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "black>=26.3.1",
    "jupyter",
    "ipywidgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physiq"]

[tool.pytest.ini_options]
testpaths = ["physiq/tests"]
pythonpath = ["physiq"]
addopts = "--import-mode=importlib"
markers = [
    "e2e: end-to-end tests that require benchmark data on disk (pass --run-e2e to run)",
]
